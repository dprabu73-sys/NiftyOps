name: Auto Sync Market Data to Google Sheets

on:
  schedule:
    # Run every weekday (Monday to Friday) at 04:00 AM UTC (09:30 AM IST)
    - cron: '30 3 * * 1-5'
  workflow_dispatch:
    # Allows you to trigger this manually from the GitHub Actions tab anytime!

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy git+https://github.com/rongardF/tvdatafeed.git

    - name: Run Data Sync Script
      env:
        SYMBOL: 'NIFTY'
        EXCHANGE: 'NSE'
        STRIKE_OFFSET: '100'
        GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
      run: python sync.py
